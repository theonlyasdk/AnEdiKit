

            <!-- IMAGE AI TOOL 1: Background Remover -->
            <div class="tool-view d-none" id="view-bg_remover">
              <div class="mb-4">
                <div class="section-divider-header">Neural Background Removal Parameters</div>
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label small fw-medium" for="bg-model">Segmentation Model</label>
                    <select class="form-select form-select-sm" id="bg-model">
                      <option value="u2net" selected>U2Net (General Purpose / Studio)</option>
                      <option value="fake_transparency">Fake Transparency (Checkerboard Grid Remover)</option>
                      <option value="u2net_human_seg">U2Net Human (Portraits &amp; People)</option>
                      <option value="u2net_cloth_seg">U2Net Cloth (Apparel &amp; Fashion)</option>
                      <option value="isnet-general-use">IS-Net (High Precision Boundaries)</option>
                      <option value="isnet-anime">IS-Net Anime (Illustrations &amp; Cel Art)</option>
                      <option value="birefnet-general">BiRefNet (Ultra-Fine Edge Detail &amp; Hair)</option>
                      <option value="silueta">Silueta (Fast Lightweight)</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label small fw-medium" for="bg-output-mode">Background Fill / Mode</label>
                    <select class="form-select form-select-sm" id="bg-output-mode">
                      <option value="transparent" selected>Transparent PNG (Cutout)</option>
                      <option value="solid_color">Solid Color Background</option>
                      <option value="blur_bg">Blurred Original Background</option>
                    </select>
                  </div>
                  <div class="col-md-4 d-none ui-zoom-in" id="bg-color-wrapper">
                    <label class="form-label small fw-medium" for="bg-color">Background Color</label>
                    <div class="input-group input-group-sm">
                      <input type="color" class="form-control form-control-color form-control-sm" id="bg-color-picker" value="#ffffff" title="Choose color" />
                      <input type="text" class="form-control form-control-sm font-sans" id="bg-color" value="#ffffff" />
                    </div>
                  </div>
                  <div class="col-md-4 d-none ui-zoom-in" id="bg-blur-wrapper">
                    <label class="form-label small fw-medium" for="bg-blur-radius">Background Blur Radius (px)</label>
                    <input type="number" class="form-control form-control-sm font-sans" id="bg-blur-radius" value="25" min="5" max="100" />
                  </div>
                </div>

                <!-- Fake Transparency Tuning Parameters -->
                <div class="row g-3 mt-1 d-none ui-zoom-in" id="fake-transparency-options">
                  <div class="col-12">
                    <div class="p-3 border rounded bg-body-tertiary">
                      <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="small fw-semibold text-body"><ion-icon name="options-outline" class="me-1 text-primary"></ion-icon> Checkerboard Grid Tuning Parameters</span>
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle">Hybrid Neural + Geometric</span>
                      </div>
                      <div class="row g-3">
                        <div class="col-md-4">
                          <label class="form-label small fw-medium text-body-secondary" for="fake-grid-tile-size">Grid Tile Size (px)</label>
                          <div class="input-group input-group-sm">
                            <input type="number" class="form-control form-control-sm font-sans" id="fake-grid-tile-size" value="0" min="0" max="64" title="0 = Auto-detect tile size" />
                            <span class="input-group-text small text-body-secondary">0 = Auto</span>
                          </div>
                        </div>
                        <div class="col-md-4">
                          <label class="form-label small fw-medium text-body-secondary" for="fake-grid-tolerance">Grid Color Tolerance</label>
                          <div class="input-group input-group-sm">
                            <input type="range" class="form-range mt-1" id="fake-grid-tolerance" min="2" max="30" step="1" value="14" />
                            <span class="ms-2 small font-sans fw-medium text-body aek-val-badge" id="fake-grid-tolerance-val">14</span>
                          </div>
                        </div>
                        <div class="col-md-4">
                          <label class="form-label small fw-medium text-body-secondary" for="fake-gap-threshold">Interior Gap Aggressiveness</label>
                          <div class="input-group input-group-sm">
                            <input type="range" class="form-range mt-1" id="fake-gap-threshold" min="5" max="30" step="1" value="15" />
                            <span class="ms-2 small font-sans fw-medium text-body aek-val-badge" id="fake-gap-threshold-val">15</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Live Estimation Readout -->
                <div class="mt-3 p-2 px-3 border rounded bg-body small text-body-secondary d-flex justify-content-between align-items-center flex-wrap gap-2" id="bg-estimate-box">
                  <div>Model: <strong class="text-body" id="bg-est-model">U2Net</strong> &bull; Output: <strong class="text-body" id="bg-est-mode">Transparent PNG</strong></div>
                  <div class="text-body-secondary small">On-device neural inference</div>
                </div>
              </div>
            </div>
