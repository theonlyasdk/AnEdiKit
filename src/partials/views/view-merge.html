

            <!-- TOOL 5: Merge & Concat -->
            <div class="tool-view d-none" id="view-merge">
              <div class="mb-4">
                <div class="section-divider-header">Merge Settings</div>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-medium" for="merge-engine">Merge Engine</label>
                    <select class="form-select form-select-sm" id="merge-engine">
                      <option value="concat_demuxer" selected>Fast Concat (Direct Stream Copy - for matching codecs)</option>
                      <option value="filter_complex">Re-encode Concat (for mixed resolutions / formats)</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-medium" for="merge-format">Output Format</label>
                    <select class="form-select form-select-sm" id="merge-format">
                      <optgroup label="Video Formats">
                        <option value="mp4" selected>MP4 (.mp4)</option>
                        <option value="mkv">MKV (.mkv)</option>
                        <option value="webm">WebM (.webm)</option>
                        <option value="mov">MOV (.mov)</option>
                        <option value="avi">AVI (.avi)</option>
                        <option value="ts">TS (.ts)</option>
                      </optgroup>
                      <optgroup label="Audio Formats">
                        <option value="mp3">MP3 (.mp3)</option>
                        <option value="m4a">M4A (.m4a)</option>
                        <option value="flac">FLAC (.flac)</option>
                        <option value="wav">WAV (.wav)</option>
                        <option value="ogg">OGG (.ogg)</option>
                      </optgroup>
                    </select>
                  </div>
                </div>
                <!-- Live Estimation Readout -->
                <div class="mt-3 p-2 px-3 border rounded bg-body small text-body-secondary d-flex justify-content-between align-items-center flex-wrap gap-2" id="merge-estimate-box">
                  <div>Files Queued: <strong class="text-body" id="merge-est-count">0 files</strong> &bull; Format: <strong class="text-body" id="merge-est-format">MP4</strong> &bull; Engine: <strong class="text-body" id="merge-est-engine">Fast Concat (Stream Copy)</strong></div>
                  <div class="text-body-secondary small">Calculated from file sequence</div>
                </div>
              </div>
            </div>
