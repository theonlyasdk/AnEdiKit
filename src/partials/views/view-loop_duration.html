

            <!-- TOOL: Loop Video & Duration Extender -->
            <div class="tool-view d-none" id="view-loop_duration">
              <div class="mb-4">
                <div class="section-divider-header">Loop &amp; Duration Parameters</div>
                <div class="row g-3">
                  <!-- Mode Selection -->
                  <div class="col-12">
                    <label class="form-label small fw-medium" for="loop-mode">Loop Mode</label>
                    <select class="form-select form-select-sm" id="loop-mode">
                      <option value="duration" selected>Target Duration (Calculate loops to reach exact time)</option>
                      <option value="count">Repeat Count (Specify exact number of repetitions)</option>
                    </select>
                  </div>

                  <!-- Target Duration Settings -->
                  <div class="col-12 ui-zoom-in" id="loop-duration-wrapper">
                    <label class="form-label small fw-medium">Target Duration</label>
                    <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
                      <button type="button" class="btn btn-outline-secondary btn-sm btn-loop-preset" data-sec="60">1 Min</button>
                      <button type="button" class="btn btn-outline-secondary btn-sm btn-loop-preset" data-sec="300">5 Min</button>
                      <button type="button" class="btn btn-outline-secondary btn-sm btn-loop-preset" data-sec="600">10 Min</button>
                      <button type="button" class="btn btn-outline-secondary btn-sm btn-loop-preset" data-sec="1800">30 Min</button>
                      <button type="button" class="btn btn-outline-secondary btn-sm btn-loop-preset active" data-sec="3600">1 Hour</button>
                      <button type="button" class="btn btn-outline-secondary btn-sm btn-loop-preset" data-sec="7200">2 Hours</button>
                      <button type="button" class="btn btn-outline-secondary btn-sm btn-loop-preset" data-sec="36000">10 Hours</button>
                    </div>
                    <div class="row g-2 align-items-center">
                      <div class="col-4 col-sm-3 col-md-2">
                        <div class="input-group input-group-sm">
                          <input type="number" class="form-control text-center font-monospace" id="loop-target-hh" min="0" max="999" value="1" />
                          <span class="input-group-text small">h</span>
                        </div>
                      </div>
                      <div class="col-4 col-sm-3 col-md-2">
                        <div class="input-group input-group-sm">
                          <input type="number" class="form-control text-center font-monospace" id="loop-target-mm" min="0" max="59" value="0" />
                          <span class="input-group-text small">m</span>
                        </div>
                      </div>
                      <div class="col-4 col-sm-3 col-md-2">
                        <div class="input-group input-group-sm">
                          <input type="number" class="form-control text-center font-monospace" id="loop-target-ss" min="0" max="59" value="0" />
                          <span class="input-group-text small">s</span>
                        </div>
                      </div>
                      <div class="col-12 col-md-6">
                        <div class="small text-body-secondary" id="loop-calc-readout">
                          Total: <strong class="text-body font-monospace" id="loop-total-time-str">01:00:00</strong> &bull; Calculated Repetitions: <strong class="text-primary font-monospace" id="loop-calc-count">Auto</strong>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Repeat Count Settings -->
                  <div class="col-12 d-none ui-zoom-in" id="loop-count-wrapper">
                    <label class="form-label small fw-medium" for="loop-repeat-count">Repeat Count (Total Plays)</label>
                    <div class="row g-2 align-items-center">
                      <div class="col-6 col-sm-4 col-md-3">
                        <div class="input-group input-group-sm">
                          <input type="number" class="form-control text-center font-monospace" id="loop-repeat-count" min="2" max="10000" value="10" />
                          <span class="input-group-text small">times</span>
                        </div>
                      </div>
                      <div class="col-6 col-sm-8 col-md-9">
                        <div class="small text-body-secondary" id="loop-count-time-readout">
                          Estimated Output Duration: <strong class="text-body font-monospace" id="loop-count-duration-str">Calculating...</strong>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Processing Mode -->
                  <div class="col-12 col-md-4">
                    <label class="form-label small fw-medium" for="loop-engine">Processing Mode</label>
                    <select class="form-select form-select-sm" id="loop-engine">
                      <option value="copy" selected>Direct Stream Copy (Lossless &amp; Instant)</option>
                      <option value="reencode">Re-encode Video &amp; Audio (High Quality)</option>
                    </select>
                  </div>

                  <!-- Audio Handling -->
                  <div class="col-12 col-md-4">
                    <label class="form-label small fw-medium" for="loop-audio-mode">Audio Handling</label>
                    <select class="form-select form-select-sm" id="loop-audio-mode">
                      <option value="keep" selected>Loop Audio with Video</option>
                      <option value="mute">Mute / Strip Audio</option>
                    </select>
                  </div>

                  <!-- Container / Format -->
                  <div class="col-12 col-md-4">
                    <label class="form-label small fw-medium" for="loop-container">Output Format</label>
                    <select class="form-select form-select-sm" id="loop-container">
                      <option value="mp4" selected>MP4 (.mp4)</option>
                      <option value="mkv">MKV (.mkv)</option>
                      <option value="webm">WebM (.webm)</option>
                      <option value="mov">MOV (.mov)</option>
                      <option value="ts">MPEG-TS (.ts)</option>
                    </select>
                  </div>

                  <!-- Re-encode video codec (conditional) -->
                  <div class="col-12 col-md-4 d-none ui-zoom-in" id="loop-reencode-codec-wrapper">
                    <label class="form-label small fw-medium" for="loop-vcodec">Video Codec</label>
                    <select class="form-select form-select-sm" id="loop-vcodec">
                      <option value="libx264" selected>H.264 (libx264)</option>
                      <option value="libx265">H.265 / HEVC (libx265)</option>
                      <option value="libsvtav1">AV1 (libsvtav1)</option>
                      <option value="libvpx-vp9">VP9 (libvpx-vp9)</option>
                    </select>
                  </div>
                </div>

                <!-- Live Estimation Readout -->
                <div class="mt-3 p-2 px-3 border rounded bg-body small text-body-secondary d-flex justify-content-between align-items-center flex-wrap gap-2" id="loop-estimate-box">
                  <div>Mode: <strong class="text-body" id="loop-est-mode">Target Duration (01:00:00)</strong> &bull; Engine: <strong class="text-body" id="loop-est-engine">Direct Stream Copy</strong> &bull; Est. Loops: <strong class="text-body" id="loop-est-loops">Calculating...</strong></div>
                  <div class="text-body-secondary small">Calculated from media duration</div>
                </div>
              </div>
            </div>
