

            <!-- YT-DLP TOOL 4: Subtitles & Thumbnails -->
            <div class="tool-view d-none" id="view-ytdlp_subtitles">
              <div class="mb-4">
                <div class="section-divider-header">Subtitle & Artwork Extraction</div>
                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-medium" for="dl-sub-lang">Subtitle Language Code</label>
                    <input type="text" class="form-control form-control-sm font-sans" id="dl-sub-lang" value="en" placeholder="en, es, ja, de, or all" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-medium" for="dl-sub-fmt">Subtitle File Format</label>
                    <select class="form-select form-select-sm" id="dl-sub-fmt">
                      <option value="srt" selected>SubRip Subtitle (.srt)</option>
                      <option value="vtt">WebVTT (.vtt)</option>
                      <option value="ass">Advanced SubStation Alpha (.ass)</option>
                      <option value="lrc">Synced Lyrics (.lrc)</option>
                    </select>
                  </div>
                </div>
                <div class="row g-3">
                  <div class="col-md-4">
                    <div class="form-check form-switch pt-2">
                      <input class="form-check-input" type="checkbox" role="switch" id="dl-sub-auto" checked />
                      <label class="form-check-label small" for="dl-sub-auto">Include Auto-Generated Subtitles</label>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="form-check form-switch pt-2">
                      <input class="form-check-input" type="checkbox" role="switch" id="dl-sub-thumb" checked />
                      <label class="form-check-label small" for="dl-sub-thumb">Download High-Res Thumbnail Cover</label>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="form-check form-switch pt-2">
                      <input class="form-check-input" type="checkbox" role="switch" id="dl-sub-info" />
                      <label class="form-check-label small" for="dl-sub-info">Write Description & JSON Metadata</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
