

            <!-- TOOL: Speed & Motion Control -->
            <div class="tool-view d-none" id="view-speed_motion">
              <div class="mb-4">
                <div class="section-divider-header">Speed &amp; Motion Parameters</div>
                <div class="row g-3">
                  <div class="col-md-8">
                    <label class="form-label small fw-medium mb-1" for="speed-preset">Speed Multiplier</label>
                    <div class="d-flex align-items-center gap-2">
                      <input type="range" class="form-range flex-grow-1 m-0 aek-range-reset" id="speed-preset" min="0.25" max="16" step="0.25" value="2.0" title="Speed multiplier (0.25x to 16x)" />
                      <div class="input-group input-group-sm flex-shrink-0" style="width: 148px;" id="speed-custom-wrapper">
                        <input type="number" class="form-control form-control-sm font-sans" id="speed-custom-val" value="2.0" min="0.1" max="100" step="0.1" title="Exact speed multiplier (0.1x to 100x)" />
                        <select class="form-select" id="speed-preset-select" title="Quick speed presets">
                          <option value="0.25">0.25x</option>
                          <option value="0.5">0.5x</option>
                          <option value="0.75">0.75x</option>
                          <option value="1">1x</option>
                          <option value="1.25">1.25x</option>
                          <option value="1.5">1.5x</option>
                          <option value="2" selected>2x</option>
                          <option value="4">4x</option>
                          <option value="8">8x</option>
                          <option value="16">16x</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div class="col-md-4">
                    <label class="form-label small fw-medium" for="speed-container">Output Format</label>
                    <select class="form-select form-select-sm" id="speed-container">
                      <option value="mp4" selected>MP4 (.mp4)</option>
                      <option value="mkv">MKV (.mkv)</option>
                      <option value="mov">MOV (.mov)</option>
                      <option value="webm">WebM (.webm)</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label small fw-medium" for="speed-audio-mode">Audio Retiming</label>
                    <select class="form-select form-select-sm" id="speed-audio-mode">
                      <option value="atempo" selected>Pitch-Corrected Audio (atempo)</option>
                      <option value="strip">Mute Audio Track</option>
                      <option value="drop">Drop Audio Sync</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label small fw-medium" for="speed-interp">Frame Interpolation</label>
                    <select class="form-select form-select-sm" id="speed-interp">
                      <option value="none" selected>None (Instant)</option>
                      <option value="blend">Frame Blending (Fast)</option>
                      <option value="minterpolate">Optical Flow Motion Interpolation (60 FPS)</option>
                    </select>
                  </div>
                </div>
                <!-- Live Bitrate Estimation Readout -->
                <div class="mt-3 p-2 px-3 border rounded bg-body small text-body-secondary d-flex justify-content-between align-items-center flex-wrap gap-2" id="speed-estimate-box">
                  <div>Speed: <strong class="text-body" id="speed-est-factor">2.0x</strong> &bull; New Duration: <strong class="text-body" id="speed-est-duration">00:01:00</strong> &bull; Est. Size: <strong class="text-body" id="speed-est-size">~21.2 MB</strong></div>
                  <div class="text-body-secondary small">Calculated from speed multiplier</div>
                </div>
              </div>
            </div>
