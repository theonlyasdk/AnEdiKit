

            <!-- TOOL 4: Compress Video -->
            <div class="tool-view d-none" id="view-compress">
              <div class="mb-4">
                <div class="section-divider-header">Compression Parameters</div>
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label small fw-medium" for="comp-preset">Target Preset</label>
                    <select class="form-select form-select-sm" id="comp-preset">
                      <option value="discord" selected>Discord Free (24 MB)</option>
                      <option value="discord_nitro">Discord Nitro (500 MB)</option>
                      <option value="whatsapp">WhatsApp Video (15 MB)</option>
                      <option value="email">Email Attachment (20 MB)</option>
                      <option value="reduce_50">50% Size Reduction</option>
                      <option value="reduce_75">75% Size Reduction</option>
                      <option value="custom">Custom Target Size (MB)</option>
                    </select>
                  </div>
                  <div class="col-md-4 d-none ui-zoom-in" id="comp-custom-wrapper">
                    <label class="form-label small fw-medium" for="comp-custom-mb">Custom Size (MB)</label>
                    <input type="number" class="form-control form-control-sm" id="comp-custom-mb" value="24" min="1" max="4000" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label small fw-medium" for="comp-scale">Max Resolution</label>
                    <select class="form-select form-select-sm" id="comp-scale">
                      <option value="original" selected>Keep Original</option>
                      <option value="1920:1080">1080p (1920x1080)</option>
                      <option value="1280:720">720p (1280x720)</option>
                      <option value="854:480">480p (854x480)</option>
                      <option value="640:360">360p (640x360)</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label small fw-medium" for="comp-vcodec">Video Codec</label>
                    <select class="form-select form-select-sm" id="comp-vcodec">
                      <option value="libx264" selected>H.264 (Maximum Compatibility)</option>
                      <option value="libx265">H.265 / HEVC (High Efficiency)</option>
                      <option value="libsvtav1">AV1 (Next-Gen)</option>
                    </select>
                  </div>
                </div>
                <!-- Live Bitrate Estimation Readout -->
                <div class="mt-3 p-2 px-3 border rounded bg-body small text-body-secondary d-flex justify-content-between align-items-center flex-wrap gap-2" id="comp-estimate-box">
                  <div>Target: <strong class="text-body" id="comp-est-target">24 MB</strong> &bull; Est. Video Bitrate: <strong class="text-body" id="comp-est-vbitrate">~1,500 kbps</strong> &bull; Audio: <strong class="text-body" id="comp-est-abitrate">96 kbps</strong></div>
                  <div class="text-body-secondary small">Calculated from media duration</div>
                </div>
              </div>
            </div>
